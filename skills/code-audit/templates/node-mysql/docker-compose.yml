services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${LAB_DB_PASS:-labpass}
      MYSQL_DATABASE: ${LAB_DB_NAME:-app}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${LAB_DB_PASS:-labpass}"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ${LAB_SOURCE:-./src}:/app
    command: >
      sh -c "npm install --no-audit --no-fund --registry=https://registry.npmmirror.com
      && node ${LAB_ENTRY:-app.js}"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${LAB_DB_NAME:-app}
      DB_USER: root
      DB_PASS: ${LAB_DB_PASS:-labpass}
      PORT: "3000"
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_1:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
